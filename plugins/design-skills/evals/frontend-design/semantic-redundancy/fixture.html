<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원 서비스</title>
<style>body{margin:0;font:16px/1.6 system-ui;color:#24312b;background:#fafbf8}header,main{max-width:960px;margin:auto;padding:24px}header{border-bottom:1px solid #dce2d9}.tabs{display:flex;gap:16px;flex-wrap:wrap}section{margin:28px 0;padding:20px;background:white;border:1px solid #dce2d9;border-radius:10px}h1,h2,h3{line-height:1.3}li{margin:12px 0}button{font:inherit;padding:8px 14px}dialog{max-width:90vw}label{display:block}dl{display:grid;grid-template-columns:100px 1fr;gap:8px}dd{margin:0}@media(max-width:600px){header h1{display:none}header,main{padding:16px}dl{grid-template-columns:80px 1fr}}</style>
<header><nav aria-label="상단"><a href="#clinic">내 기관</a></nav><h1>호움산부인과 · Houm PFC</h1><div class="tabs"><a href="#clinic">기관 정보</a><a href="#providers">기관 목록</a><a href="#purchase">횟수권 구매</a></div></header>
<main>
<section id="clinic" aria-labelledby="clinic-title"><h2 id="clinic-title">기관 정보</h2><p>Pelvic Floor Center</p><dl><dt>기관명</dt><dd>호움산부인과</dd><dt>주소</dt><dd>서울 서초구 샘플로 10</dd><dt>전화</dt><dd>02-000-0000</dd><dt>결제 책임 기관</dt><dd>호움산부인과</dd></dl></section>
<section id="providers" aria-labelledby="providers-title"><h2 id="providers-title">기관 목록</h2><ul><li><h3>호움산부인과 · Houm PFC</h3><span>서초점</span><button type="button">기관 열기</button></li><li><h3>호움산부인과 · Houm PFC</h3><span>송파점</span><button type="button">기관 열기</button></li><li><h3>늘봄재활의학과</h3><span>본점</span><button type="button">기관 열기</button></li></ul></section>
<section id="purchase" aria-labelledby="purchase-title"><h2 id="purchase-title">횟수권 구매</h2><fieldset><legend>구매할 횟수권</legend><label><input type="radio" name="pass" value="5" checked>5회권 · 100,000원</label><label><input type="radio" name="pass" value="10">10회권 · 180,000원</label></fieldset><button type="button" id="open-confirmation">신청 확인</button></section>
<dialog id="confirmation" aria-labelledby="confirm-title"><h2 id="confirm-title">신청 확인</h2><p>호움산부인과 · Houm PFC</p><p id="selected-pass">5회권</p><button type="button" id="close-confirmation">닫기</button></dialog>
</main>
<script>const sourceData={provider:{name:'호움산부인과 · Houm PFC',organizationName:'호움산부인과',description:'Pelvic Floor Center',address:'서울 서초구 샘플로 10',phone:'02-000-0000',billingOrganization:'호움산부인과'}};document.getElementById('open-confirmation').onclick=()=>{document.getElementById('selected-pass').textContent=document.querySelector('input[name="pass"]:checked').value+'회권';document.getElementById('confirmation').showModal()};document.getElementById('close-confirmation').onclick=()=>document.getElementById('confirmation').close();document.querySelectorAll('#providers button').forEach(b=>b.onclick=()=>{b.textContent='기관 선택됨'});</script></html>
